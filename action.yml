name: "Terraform Plan Summary"
description: 'Creates a Job summary from a "terraform show -json" plan file'
author: seatling
branding:
  icon: table
  color: purple

inputs:
  plan-file:
    description: "Path to Terraform plan JSON file (generated via: terraform show -json tfplan.binary > tfplan.json)"
    required: false
    default: tfplan.json
  title:
    description: "Title of the job summary"
    required: false
    default: "Terraform Plan Summary"

runs:
  using: "node24"
  main: "index.js"
